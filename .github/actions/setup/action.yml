name: Setup development environment
description: Setup mise and install dependencies

inputs:
  cache_save:
    description: Whether to save mise cache (set to false in parallel jobs to avoid conflicts)
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      with:
        cache_save: ${{ inputs.cache_save }}

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}

    - run: bun install --frozen-lockfile
      shell: bash
