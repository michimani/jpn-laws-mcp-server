name: Setup development environment
description: Setup mise and install dependencies

inputs:
  cache_save:
    description: Whether to save mise cache (set to false in parallel jobs to avoid conflicts)
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      with:
        cache_save: ${{ inputs.cache_save }}

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}

    - run: bun install --frozen-lockfile
      shell: bash
